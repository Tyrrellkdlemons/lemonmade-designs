<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>LemonMade Designs form registration</title>
  </head>
  <body>
    <!-- Static form skeletons let Netlify register fields submitted by React. -->
    <form name="start-project" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="start-project" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="business" />
      <input type="text" name="projectType" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="contactMethod" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="mockup-builder" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="mockup-builder" />
      <input type="text" name="businessName" />
      <input type="text" name="businessType" />
      <input type="text" name="colors" />
      <input type="text" name="style" />
      <input type="text" name="pages" />
      <input type="text" name="features" />
      <input type="text" name="inspiration" />
      <textarea name="description"></textarea>
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="contactName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="bot-field" />
    </form>

    <form name="domain-help" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="domain-help" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="domainNeed" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
